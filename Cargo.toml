[workspace]
members = [
    "apps/shell/src-tauri",
    "crates/jonex-core",
    "crates/jonex-plugin-api",
    "crates/jonex-plugin-host",
    "crates/jonex-settings",
    "crates/jonex-telemetry",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/BMJ812/jonex"
rust-version = "1.95"

[workspace.dependencies]
log = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri = "2"
tauri-build = "2"
tauri-plugin-log = "2"
tempfile = "3"