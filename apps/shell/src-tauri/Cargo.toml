[package]
name = "jonex-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native JØNEX desktop shell"

[lib]
name = "jonex_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jonex-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
jonex-core = { path = "../../../crates/jonex-core" }
jonex-plugin-host = { path = "../../../crates/jonex-plugin-host" }
jonex-settings = { path = "../../../crates/jonex-settings" }
jonex-service-registry = { path = "../../../crates/jonex-service-registry" }
jonex-telemetry = { path = "../../../crates/jonex-telemetry" }
log.workspace = true
tauri.workspace = true
tauri-plugin-log.workspace = true